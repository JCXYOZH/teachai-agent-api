# Internal edge (node2): ingress for the cpolar tunnel.
#
# The cpolar client reaches this port over IPv6 loopback (::1). A bare
# "listen 80;" binds IPv4 only, so the request lands on the [::]:80 socket
# owned by teachai-agent.conf, whose Host does not match and whose default
# handler returns "301 https://$host$request_uri" - a self-redirect that
# leaks the tunnel hostname to the browser.
#
# Listen on both sockets and claim default_server, so a cpolar subdomain
# change never needs a config edit.
#
# Depends on teachai_api / teachai_web upstreams and $connection_upgrade
# defined in nginx.conf + teachai-agent.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The browser side is HTTPS; keep the same scheme and public host so the
    # app does not downgrade cookies or build http:// absolute URLs.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host ai.offer.us.ci;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location /api/ {
        proxy_pass http://teachai_api;
    }

    location /docs {
        proxy_pass http://teachai_api;
    }

    location /static/ {
        proxy_pass http://teachai_api;
    }

    location / {
        proxy_pass http://teachai_web;
    }
}