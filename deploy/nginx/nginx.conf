# TeachAI Agent - main Nginx configuration for a source install at /usr/local/nginx.
# Install as /usr/local/nginx/conf/nginx.conf, put the site file at
# /usr/local/nginx/conf/conf.d/teachai-agent.conf, then:
#   /usr/local/nginx/sbin/nginx -t
#   /usr/local/nginx/sbin/nginx -s reload
# Requires a binary built with --with-http_ssl_module (check: nginx -V 2>&1).

# Worker account. Change to nobody if the nginx account does not exist.
user  nginx;
worker_processes  auto;

error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  logs/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_header_timeout 60s;
    client_body_timeout   120s;
    send_timeout          900s;

    # Hard ceiling; the site block raises this to 64m for uploads.
    client_max_body_size 16m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml application/xml+rss image/svg+xml;

    # WebSocket upgrade helper used by Next.js HMR and any future streaming routes.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include conf.d/*.conf;
}