# TeachAI Agent production site (host Nginx).
# Install as /usr/local/nginx/conf/conf.d/teachai-agent.conf.
# Change server_name if the public host differs from ai.offer.us.ci, and
# __CERT_DIR__ if the certificate is stored somewhere else.
# Both containers publish on the host, so this file is the public HTTP entry:
#   frontend 127.0.0.1:49153
#   backend  127.0.0.1:65534
#
# Public traffic arrives over the frp TCP tunnel: frps on the overseas relay
# forwards 80/443 here, so TLS still terminates on this host and the 443
# listener expects the PROXY protocol header sent by frpc. Remove
# `proxy_protocol` (and set_real_ip_from / real_ip_header) if the entry point
# ever changes to a plain reverse proxy.

# $connection_upgrade is defined in nginx.conf.

upstream teachai_web {
    server 127.0.0.1:49153;
    keepalive 32;
}

upstream teachai_api {
    server 127.0.0.1:65534;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.offer.us.ci;

    location /.well-known/acme-challenge/ {
        root /usr/local/nginx/html/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 proxy_protocol;
    listen [::]:443 ssl http2;
    server_name ai.offer.us.ci;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # frpc connects from 127.0.0.1 with PROXY protocol v2; without these two
    # lines $remote_addr stays 127.0.0.1 and every IP-scoped rate limit
    # (SMS verification, chat quota) collapses into one shared bucket.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 50 MB uploads plus multipart overhead.
    client_max_body_size 64m;
    client_body_timeout 300s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;


    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # Material uploads: stream the request body straight to the API instead of
    # spooling it to nginx temp files, and let the API answer 413 early. Keep
    # client_max_body_size above ASSET_MAX_BYTES or nginx truncates first.
    location = /api/v1/assets {
        proxy_pass http://teachai_api;
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Teacher chat streams over SSE: disable buffering, caching and gzip so
    # tokens reach the browser as they are produced. Plain TCP forwarding in
    # frp does not buffer, so this block is the only place that can.
    location ~ ^/api/v1/courses/[0-9a-zA-Z-]+/chat/messages/stream$ {
        proxy_pass http://teachai_api;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # API surface, Swagger UI and its static assets.
    location /api/ {
        proxy_pass http://teachai_api;
    }

    location /docs {
        proxy_pass http://teachai_api;
    }

    location /static/ {
        proxy_pass http://teachai_api;
    }

    # Next.js app, including immutable /_next/static assets.
    location / {
        proxy_pass http://teachai_web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}