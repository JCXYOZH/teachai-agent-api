# 海外中转机：ai.offer.us.ci 全量代理到 cpolar（无任何 301/302）。
# 适用场景：前端与后端都在 node2 上，中转机只做 TLS 终结 + 单跳转发。
# 替换：__CPOLAR_HOST__（cpolar 子域名）。
#
# 为什么不能 return 301 到 cpolar：
#   浏览器会跨域请求 cpolar 域名，触发 CORS 拦截，且 refresh/CSRF cookie
#   属于 ai.offer.us.ci，跨域后全丢。

resolver 223.5.5.5 119.29.29.29 ipv6=off valid=60s;

map $http_upgrade $relay_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ai.offer.us.ci;

    location /.well-known/acme-challenge/ {
        root /www/server/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ai.offer.us.ci;

    ssl_certificate     /www/server/panel/vhost/cert/ai.offer.us.ci/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ai.offer.us.ci/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64m;

    set $cpolar_host __CPOLAR_HOST__;

    proxy_http_version 1.1;
    # 关键：Host / SNI 都必须是 cpolar 子域名，否则 cpolar 回 404 或 301。
    proxy_set_header Host $cpolar_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $cpolar_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 保留对外的真实域名，供后端日志与绝对 URL 使用。
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $relay_upgrade;

    # 关掉上游重定向改写，避免把 cpolar 的内部 Location 暴露给浏览器。
    proxy_redirect off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass https://$cpolar_host;
    }
}