# 海外中转机站点（宝塔：/www/server/panel/vhost/nginx/ai.offer.us.ci.conf）
# 替换项：
#   __CPOLAR_HOST__      当前穿透的 cpolar 子域名
#   __WEB_UPSTREAM__     前端上游，保持你现在 / 正在用的地址
#   证书路径按宝塔实际位置调整
#
# 关键：/api/ 走 cpolar 时 Host 必须改成 cpolar 子域名。
# cpolar 按 Host 路由，传 ai.offer.us.ci 会直接返回它自己的 404 页面。

resolver 223.5.5.5 119.29.29.29 ipv6=off valid=60s;

map $http_upgrade $relay_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ai.offer.us.ci;

    location /.well-known/acme-challenge/ {
        root /www/server/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ai.offer.us.ci;

    ssl_certificate     /www/server/panel/vhost/cert/ai.offer.us.ci/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ai.offer.us.ci/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64m;

    set $cpolar_host __CPOLAR_HOST__;

    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # 前端：保持现有上游，Host 传原始域名。
    location / {
        proxy_pass http://__WEB_UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $relay_upgrade;
    }

    # 后端：走 cpolar。变量 + resolver 避免 cpolar 换子域名后 nginx 启动失败。
    location ^~ /api/ {
        proxy_pass https://$cpolar_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $cpolar_host;
        proxy_set_header Host $cpolar_host;
    }

    location /docs {
        proxy_pass https://$cpolar_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $cpolar_host;
        proxy_set_header Host $cpolar_host;
    }

    location /static/ {
        proxy_pass https://$cpolar_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $cpolar_host;
        proxy_set_header Host $cpolar_host;
    }
}