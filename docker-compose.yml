services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    # 镜像内 HEALTHCHECK 固定探测 65534，而 dev 跑在 8000；不覆盖的话容器永远 unhealthy。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
