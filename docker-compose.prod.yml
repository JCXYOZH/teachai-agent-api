# TeachAI Agent API 后端生产编排。
# 宿主机 Nginx 终止 TLS，反向代理到 127.0.0.1:65534。
# PostgreSQL 运行在宿主机，容器共用 host 网络并通过 127.0.0.1 访问；
# uvicorn 只监听 127.0.0.1:65534，仅本机 Nginx 可回源，其他机器无法直连。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # 服务器默认的 bridge 网络无法解析 pypi.org，因此构建时使用 host 网络。
      network: host
    image: teachai-agent-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      WAIT_FOR_DATABASE: "1"
      RUN_MIGRATIONS: "1"
    network_mode: host
    command:
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - "65534"
      - --proxy-headers
    volumes:
      - /data/TeachAIAgent:/data/TeachAIAgent
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
